name: mcp-production-health

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Semantic check (specs/004 FR-013): status must be "ok"; the additive `revision`
      # field (deployed commit, or null) is allowed. Shared, unit-tested parser.
      - name: Check public health endpoint
        run: python .github/scripts/post_deploy_verify.py health https://mcp.cluexp.com/healthz

      # specs/003: /mcp is public, read-only discovery. A real tool call is the only
      # meaningful check: a broken /v1 key still answers HTTP 200 with an error inside the
      # tool result. Any non-200 (including a 401 from a rollback to the old sign-in build) fails.
      - name: Check MCP list_services
        run: python .github/scripts/post_deploy_verify.py list-services https://mcp.cluexp.com/mcp
